[project]
name = "analyzer"
version = "0.0.0"
description = "Trace reassembly and service topology reconstruction"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.7,<1.0",
    "prometheus-client>=0.20,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
