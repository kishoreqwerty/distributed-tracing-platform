services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the "spans" topic with a fixed partition count before
  # collector/writer start. Partition count is a topic-creation-time
  # decision in Kafka/Redpanda (changing it later reshuffles keys across
  # partitions), so it's set explicitly here rather than left to
  # auto-create-on-first-produce defaults.
  redpanda-topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - "rpk topic create spans --partitions 4 --replicas 1 --brokers redpanda:9092 || rpk topic describe spans --brokers redpanda:9092"
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      # The official image restricts the "default" user to localhost unless
      # a password is set, which would block the writer's remote connection.
      CLICKHOUSE_PASSWORD: "tracing-dev"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password tracing-dev --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  collector:
    build: ../collector
    environment:
      COLLECTOR_GRPC_ADDR: ":4317"
      COLLECTOR_HTTP_ADDR: ":4318"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_TOPIC: "spans"
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      redpanda-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:4318/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  writer:
    build: ../writer
    environment:
      WRITER_HTTP_ADDR: ":8080"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_TOPIC: "spans"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DB: "tracing"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "tracing-dev"
    ports:
      - "8080:8080"
    depends_on:
      redpanda-topic-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  analyzer:
    build: ../analyzer
    environment:
      ANALYZER_HTTP_HOST: "0.0.0.0"
      ANALYZER_HTTP_PORT: "9464"
      CLICKHOUSE_HTTP_HOST: "clickhouse"
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: "tracing"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "tracing-dev"
    ports:
      - "9464:9464"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9464/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Same image as `analyzer` (same build context, same installed
  # package) — only the entrypoint differs. Deliberately a separate
  # container: the query API serves browser requests on its own
  # schedule, and has no business sharing a process with analyzer's
  # synchronous reassembly/detection poll loop. See docs/DECISIONS.md.
  analyzer-api:
    build: ../analyzer
    entrypoint: ["uvicorn", "analyzer.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CLICKHOUSE_HTTP_HOST: "clickhouse"
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: "tracing"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "tracing-dev"
      API_MAX_ROWS: "500"
      API_MAX_TIME_RANGE_SECONDS: "86400"
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      collector:
        condition: service_healthy
      writer:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
